<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bgGrad)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.5"/>

  <rect x="0" y="0" width="1280" height="6" fill="url(#accentGrad)"/>
  <rect x="0" y="354" width="1280" height="6" fill="url(#accentGrad)"/>

  <!-- Pipeline icon motif -->
  <g transform="translate(70,130)" opacity="0.9">
    <circle cx="0" cy="50" r="14" fill="#38bdf8"/>
    <rect x="14" y="45" width="60" height="10" fill="#334155"/>
    <rect x="74" y="30" width="14" height="40" rx="3" fill="#818cf8"/>
    <rect x="88" y="45" width="60" height="10" fill="#334155"/>
    <polygon points="148,25 178,50 148,75" fill="#f472b6"/>
    <rect x="178" y="45" width="60" height="10" fill="#334155"/>
    <circle cx="252" cy="50" r="14" fill="#34d399"/>
  </g>

  <text x="70" y="230" font-family="Verdana, Arial, sans-serif" font-size="54" font-weight="bold" fill="#f8fafc">
    Data Engineering Handbook
  </text>
  <text x="70" y="270" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#94a3b8">
    Mastery: From Beginner to Production
  </text>

  <!-- Module chips -->
  <g font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="bold">
    <rect x="70" y="290" width="130" height="34" rx="17" fill="#0ea5e9" opacity="0.15" stroke="#38bdf8"/>
    <text x="90" y="312" fill="#7dd3fc">16 Modules</text>

    <rect x="212" y="290" width="150" height="34" rx="17" fill="#818cf8" opacity="0.15" stroke="#818cf8"/>
    <text x="232" y="312" fill="#c7d2fe">SQL to AI/MCP</text>

    <rect x="374" y="290" width="190" height="34" rx="17" fill="#f472b6" opacity="0.15" stroke="#f472b6"/>
    <text x="394" y="312" fill="#fbcfe8">Legacy + Modern Stacks</text>

    <rect x="576" y="290" width="210" height="34" rx="17" fill="#34d399" opacity="0.15" stroke="#34d399"/>
    <text x="596" y="312" fill="#a7f3d0">Zero to Architect-Level</text>
  </g>

  <text x="1210" y="335" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="end">
    github.com/Ritik2703
  </text>
